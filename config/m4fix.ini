; m4fix - navigation performance fixes for Myst IV: Revelation
; Lives next to Myst4.exe. Set any option to 0 to disable it.

[m4fix]
; LEADTOOLS 13 (the image library) allocates every decoded texture/tile as an
; uncached (SEC_NOCACHE) memory-mapped section. 1 = use normal cached heap memory.
LeadtoolsHeap=1

; The sound engine takes kernel mutexes tens of thousands of times per node
; change. 1 = use lightweight critical sections instead (same semantics).
SoundLocks=1

; Fixed delay (ms) between clicking and the node change starting, during which
; the picture is frozen and input is disabled. Original game: 550. Range 1-550.
TransitionDelayMs=100

; 1 = write m4fix.log next to this file.
Log=0
